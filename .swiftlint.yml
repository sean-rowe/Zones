# CodeRabbit runs SwiftLint with opt-in rules enabled. The settings below say
# which of those this codebase accepts and which it declines, deliberately,
# rather than working around them at each site.

disabled_rules:
  # Would have every class carry an empty `deinit` purely to satisfy the rule.
  - required_deinit

opt_in_rules:
  - empty_count
  - force_unwrapping
  - redundant_nil_coalescing

excluded:
  - .build

identifier_name:
  # Geometry code reads better with short names: `x`, `y`, `w`, `h` in
  # DisplayIdentity.geometryKey, `i` for a zone index in the generators.
  min_length:
    warning: 1
    error: 1

# Test step definitions read as prose and run long by design.
type_body_length:
  warning: 400
  error: 600
